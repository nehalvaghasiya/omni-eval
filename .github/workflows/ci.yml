name: Core CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11','3.12','3.13']
        profile: ['core','full']
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: uv lock --check
      - if: matrix.profile == 'core'
        run: uv sync --locked --group dev
      - if: matrix.profile == 'full'
        run: uv sync --locked --group dev --all-extras
      - run: uv run --no-sync ruff check .
      - run: uv run --no-sync ruff format --check .
      - if: matrix.profile == 'full'
        run: uv run --no-sync mypy src/omni_eval
      - run: uv run --no-sync pytest -q --cov=omni_eval --cov-branch
        env:
          OMNIEVAL_REQUIRE_EXTRAS: ${{ matrix.profile == 'full' && '1' || '0' }}
      - if: matrix.profile == 'full'
        run: uv build
      - run: uv run --no-sync python scripts/smoke.py
      - if: matrix.profile == 'full'
        run: uv run --no-sync python scripts/wheel.py
