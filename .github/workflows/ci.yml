name: Core CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    name: Python ${{ matrix.python }} / ${{ matrix.profile }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      UV_PYTHON: ${{ matrix.python }}
    strategy:
      matrix:
        python: ['3.11','3.12','3.13']
        profile: ['core','full']
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          version: '0.12.1'
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: uv lock --check
      - if: matrix.profile == 'core'
        run: uv sync --locked --group dev
      - if: matrix.profile == 'full'
        run: uv sync --locked --group dev --all-extras
      - name: Verify matrix interpreter
        run: |
          uv run --no-sync python - <<'PY'
          import os
          import sys

          actual = f"{sys.version_info.major}.{sys.version_info.minor}"
          assert actual == os.environ["UV_PYTHON"], (actual, os.environ["UV_PYTHON"])
          print(sys.version)
          PY
      - run: uv run --no-sync ruff check .
      - run: uv run --no-sync ruff format --check .
      - if: matrix.profile == 'full'
        run: uv run --no-sync mypy src/omni_eval
      - run: uv run --no-sync pytest -q --cov=omni_eval --cov-branch
        env:
          OMNIEVAL_REQUIRE_EXTRAS: ${{ matrix.profile == 'full' && '1' || '0' }}
      - if: matrix.profile == 'full'
        run: uv build
      - run: uv run --no-sync python scripts/smoke.py
      - if: matrix.profile == 'full'
        run: uv run --no-sync python scripts/wheel.py
