name: Integration
on:
  workflow_dispatch:
  schedule:
    - cron: '0 10 * * 1'
permissions:
  contents: read
jobs:
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.1'
          python-version: '3.12'
      - name: Check dependency lock
        run: uv lock --check
      - name: Install locked development dependencies
        run: uv sync --locked --group dev
      - name: Run integration, contract, and security tests
        run: uv run --no-sync pytest tests/integration tests/contracts tests/security -q
