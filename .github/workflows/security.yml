name: Security
on:
  push:
  pull_request:
  schedule:
    - cron: '0 12 * * 2'
permissions:
  contents: read
jobs:
  secrets:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: 'false'
  dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.1'
          python-version: '3.12'
      - name: Check dependency lock
        run: uv lock --check
      - run: uv export --locked --no-dev --no-emit-project --format requirements-txt > requirements-audit.txt
      - run: uvx --from pip-audit pip-audit --disable-pip -r requirements-audit.txt
