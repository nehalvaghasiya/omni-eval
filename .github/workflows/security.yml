name: Security checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  local-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --group dev
      - run: uv run --no-sync pytest -q tests/security
      # Dependency/scanner qualification remains planned; a version probe is not an audit.
