name: Security regression tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  local-security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          version: '0.12.1'
          enable-cache: true
      - run: uv sync --locked --group dev
      - run: uv run --no-sync pytest -q tests/security
