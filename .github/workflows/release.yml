name: Trusted release
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
permissions:
  contents: read
jobs:
  artifact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv lock --check
      - run: uv sync --locked --group dev --all-extras
      - run: uv run --no-sync pytest -q
        env:
          OMNIEVAL_REQUIRE_EXTRAS: '1'
      - run: uv run --no-sync ruff check .
      - run: uv run --no-sync mypy src/omni_eval
      - run: uv build
      - run: uv run --no-sync python scripts/smoke.py
      - run: uv run --no-sync python scripts/wheel.py
      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/*
      # No PyPI publication until all release gates and owner approval succeed.
