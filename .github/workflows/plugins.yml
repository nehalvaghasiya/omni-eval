name: Integration qualification
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/omni_eval/plugins/**'
      - 'workers/**'
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --group dev
      - run: uv run --no-sync pytest -q tests/integration/test_plugin.py
      # Do not mark upstream providers verified until real framework jobs are added.
